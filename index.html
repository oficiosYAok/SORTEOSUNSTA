<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo Educativo - UNSTA CUC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .tab-active { border-bottom: 3px solid #C9A227; color: #003087; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header Móvil + Escritorio -->
  <div class="bg-white shadow-sm border-b py-4">
    <div class="max-w-md md:max-w-6xl mx-auto px-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://i1.sndcdn.com/avatars-cLEbOjWz2zZMiHzD-wIsmGQ-t1080x1080.jpg" 
             alt="UNSTA" class="w-12 h-12 object-contain">
        <div>
          <h1 class="text-xl md:text-2xl font-bold text-[#003087]">UNSTA CUC</h1>
          <p class="text-xs md:text-sm text-gray-600">Sorteo Educativo</p>
        </div>
      </div>
      <button onclick="showTab(1)" class="text-[#003087] font-medium">Administrar →</button>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 md:p-6">
    <!-- FORMULARIO -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
      <div class="bg-[#003087] text-white p-8 text-center">
        <h2 class="text-3xl font-bold">¡Participa del Sorteo!</h2>
      </div>

      <form id="form-registro" class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
          <input type="text" id="nombreCompleto" required class="w-full px-4 py-3 border rounded-xl">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DNI *</label>
          <input type="text" id="dni" required maxlength="10" class="w-full px-4 py-3 border rounded-xl">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Celular *</label>
          <input type="tel" id="celular" required class="w-full px-4 py-3 border rounded-xl">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" class="w-full px-4 py-3 border rounded-xl">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">¿Qué te gustaría estudiar?</label>
          <input type="text" id="carrera" class="w-full px-4 py-3 border rounded-xl">
        </div>

        <button type="submit" 
          class="w-full bg-[#003087] text-white py-4 rounded-2xl font-semibold text-lg">
          Participar en el Sorteo
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL ¡SUERTE! -->
  <div id="suerte-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl shadow-2xl max-w-xs w-full mx-4 text-center">
      <div class="bg-[#003087] p-8 rounded-t-3xl">
        <div class="text-7xl mb-4">🍀</div>
        <h2 class="text-4xl font-bold text-white">¡SUERTE!</h2>
      </div>
      <div class="p-6">
        <p class="text-gray-600 mb-6">¡Gracias por participar!<br>Te deseamos lo mejor.</p>
        <button onclick="cerrarModal()" 
          class="w-full bg-[#003087] text-white py-4 rounded-2xl font-semibold">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <script>
    let participantes = [];

    // Cargar datos guardados
    function cargarDatos() {
      const guardados = localStorage.getItem('participantesUNSTA');
      if (guardados) participantes = JSON.parse(guardados);
    }

    // Guardar datos
    function guardarDatos() {
      localStorage.setItem('participantesUNSTA', JSON.stringify(participantes));
    }

    // Formulario
    document.getElementById('form-registro').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombreCompleto').value.trim();
      const dni = document.getElementById('dni').value.trim();
      const celular = document.getElementById('celular').value.trim();

      if (!nombre || !dni || !celular) {
        alert("Por favor completa Nombre, DNI y Celular");
        return;
      }

      if (participantes.some(p => p.dni === dni)) {
        alert("Ya existe una persona registrada con ese DNI");
        return;
      }

      participantes.unshift({
        nombreCompleto: nombre,
        dni: dni,
        celular: celular,
        email: document.getElementById('email').value.trim(),
        carrera: document.getElementById('carrera').value.trim(),
        fecha: new Date().toLocaleString('es-AR')
      });

      guardarDatos();
      this.reset();

      // Mostrar modal
      document.getElementById('suerte-modal').classList.remove('hidden');
    });

    function cerrarModal() {
      document.getElementById('suerte-modal').classList.add('hidden');
    }

    function showTab(n) {
      alert("Panel Administrar en desarrollo.\n\nParticipantes registrados: " + participantes.length);
    }

    // Iniciar
    window.onload = function() {
      cargarDatos();
    };
  </script>
</body>
</html>
